      - name: annee
        data_tests:
          - not_null
      - name: sexe
        data_tests:
          - accepted_values:
              values: ['Hommes et Femmes', 'Hommes', 'Femmes']
      - name: valeur
        data_tests:
          - not_null
  - name: base_episodes_depressifs_hist
    description: "Épisode dépressif caractérisé au cours des 12 derniers mois (prévalence en %), Baromètres santé 2005-2021, par région et sexe"
    columns:
      - name: indicateur
        data_tests:
